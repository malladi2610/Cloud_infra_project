services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-template2}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-template2}
      POSTGRES_DB: ${DB_NAME:-template2}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_template2:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8ndb
      DB_POSTGRESDB_USER: ${DB_USER:-template2}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-template2}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change_me_internal_token}
      N8N_ENCRYPTION_KEY: ${INTERNAL_API_TOKEN:-change_me_internal_token}
      N8N_RUNNERS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_TASK_TIMEOUT: ${N8N_RUNNERS_TASK_TIMEOUT:-1200}
      N8N_RUNNERS_MAX_OLD_SPACE_SIZE: ${N8N_RUNNERS_MAX_OLD_SPACE_SIZE:-512}
      N8N_WEBHOOK_BASE: ${N8N_WEBHOOK_BASE:-http://n8n:5678/webhook}
      N8N_RUN_WEBHOOK_URL: ${N8N_RUN_WEBHOOK_URL:-http://n8n:5678/webhook/summaries/run}
      APP_INTERNAL_BASE_URL: ${APP_INTERNAL_BASE_URL:-http://app:8080}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BATCH_COMPLETION_WINDOW: ${OPENAI_BATCH_COMPLETION_WINDOW:-24h}
      OPENAI_INPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_INPUT_TOKEN_PRICE_PER_MILLION_USD:-0.15}
      OPENAI_OUTPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_OUTPUT_TOKEN_PRICE_PER_MILLION_USD:-0.60}
      OPENAI_BATCH_INPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_BATCH_INPUT_TOKEN_PRICE_PER_MILLION_USD:-0.075}
      OPENAI_BATCH_OUTPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_BATCH_OUTPUT_TOKEN_PRICE_PER_MILLION_USD:-0.30}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-20}
      MAX_WAIT_SECONDS: ${MAX_WAIT_SECONDS:-60}
      BENCHMARK_REPETITIONS: ${BENCHMARK_REPETITIONS:-3}
      BENCHMARK_JOBS_PER_RUN: ${BENCHMARK_JOBS_PER_RUN:-20}
      BATCH_POLLER_INTERVAL_MS: ${BATCH_POLLER_INTERVAL_MS:-20000}
      BATCH_POLLER_MAX_LOOPS: ${BATCH_POLLER_MAX_LOOPS:-45}
      BENCHMARK_BATCH_POLL_INTERVAL_MS: ${BENCHMARK_BATCH_POLL_INTERVAL_MS:-20000}
      BENCHMARK_BATCH_MAX_WAIT_MS: ${BENCHMARK_BATCH_MAX_WAIT_MS:-7200000}
    depends_on:
      - postgres

  app:
    image: node:20-alpine
    command: sh -lc "if [ ! -d node_modules ]; then npm install; fi && npm run dev"
    working_dir: /workspace/app
    volumes:
      - ./:/workspace
    ports:
      - "8080:8080"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_PORT: ${APP_PORT:-8080}
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-template2}
      DB_USER: ${DB_USER:-template2}
      DB_PASSWORD: ${DB_PASSWORD:-template2}
      DB_SSL: ${DB_SSL:-false}
      DB_SSL_REJECT_UNAUTHORIZED: ${DB_SSL_REJECT_UNAUTHORIZED:-false}
      SESSION_SECRET: ${SESSION_SECRET:-change_me_session_secret}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change_me_internal_token}
      N8N_WEBHOOK_BASE: ${N8N_WEBHOOK_BASE:-http://n8n:5678/webhook}
      N8N_RUN_WEBHOOK_URL: ${N8N_RUN_WEBHOOK_URL:-http://n8n:5678/webhook/summaries/run}
      N8N_BENCHMARK_WEBHOOK_URL: ${N8N_BENCHMARK_WEBHOOK_URL:-http://n8n:5678/webhook/benchmarks/run}
      N8N_REQUEST_TIMEOUT_MS: ${N8N_REQUEST_TIMEOUT_MS:-10000}
      DEFAULT_PROFILE_ID: ${DEFAULT_PROFILE_ID:-pdf_batch_summary}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_FILE_UPLOAD_MAX_RETRIES: ${OPENAI_FILE_UPLOAD_MAX_RETRIES:-3}
      OPENAI_FILE_UPLOAD_RETRY_BASE_MS: ${OPENAI_FILE_UPLOAD_RETRY_BASE_MS:-750}
      OPENAI_INPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_INPUT_TOKEN_PRICE_PER_MILLION_USD:-0.15}
      OPENAI_OUTPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_OUTPUT_TOKEN_PRICE_PER_MILLION_USD:-0.60}
      OPENAI_BATCH_INPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_BATCH_INPUT_TOKEN_PRICE_PER_MILLION_USD:-0.075}
      OPENAI_BATCH_OUTPUT_TOKEN_PRICE_PER_MILLION_USD: ${OPENAI_BATCH_OUTPUT_TOKEN_PRICE_PER_MILLION_USD:-0.30}
      BENCHMARK_REPETITIONS: ${BENCHMARK_REPETITIONS:-3}
      BENCHMARK_JOBS_PER_RUN: ${BENCHMARK_JOBS_PER_RUN:-20}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-20}
      MAX_WAIT_SECONDS: ${MAX_WAIT_SECONDS:-60}
      BLOB_PROVIDER: ${BLOB_PROVIDER:-local}
      LOCAL_BLOB_DIR: ${LOCAL_BLOB_DIR:-/workspace/storage/documents}
      AZURE_BLOB_CONNECTION_STRING: ${AZURE_BLOB_CONNECTION_STRING:-}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER:-template2-documents}
      PDF_RETENTION_DAYS: ${PDF_RETENTION_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@template2.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      - postgres
      - n8n

volumes:
  pgdata_template2:
